name: Windows build

# Must run on a real Windows runner — PyInstaller does not cross-compile,
# so this can't be produced from the Linux machine this project is
# developed on. Triggered manually or on a release tag; uploads the built
# LiveWall.exe (as a zipped onedir folder) as a workflow artifact, and
# attaches it to the release when triggered by one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# The default GITHUB_TOKEN is read-only for repo contents unless a workflow
# explicitly asks for write access — needed here so the "Attach to release"
# step can actually create/update a GitHub Release (it 403'd without this).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # No python-version input here — that's a setup-python input, not
        # setup-uv's; uv already picks Python 3.12 from pyproject.toml's
        # requires-python on its own.
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # pyproject.toml's Windows-only deps (PySide6, pywin32, winshell)
        # are gated by sys_platform == 'win32' markers, not an extras group —
        # `uv sync` resolves them automatically since this runner IS win32.
        # --group windows-build additionally pulls in PyInstaller itself
        # (a build tool, not something LiveWall depends on at runtime).
        run: uv sync --group windows-build

      - name: Fetch mpv.exe
        shell: pwsh
        run: |
          # NOTE: this used to download directly from SourceForge, but that
          # broke twice: (1) the project-root "latest/download" link is
          # ambiguous across its 64bit-v3/64bit/32bit/libmpv/release folders,
          # so it served an HTML listing page instead of redirecting to a
          # file; (2) even the folder-scoped link hit a Cloudflare JS
          # challenge ("Just a moment...") that a scripted request can never
          # solve — SourceForge's download-redirect endpoints actively block
          # non-browser clients. Chocolatey (preinstalled on GitHub's Windows
          # runners) mirrors the same upstream mpv Windows build without that
          # problem, so it's used here instead.
          choco install mpv -y --no-progress

          # The "mpv" chocolatey package is itself just a metapackage that
          # depends on "mpvio.install" for the actual binary — the real
          # mpv.exe lands under that dependency's own lib subfolder (e.g.
          # ...\chocolatey\lib\mpvio.install\tools\...), not under
          # ...\lib\mpv\. Searching the whole lib tree instead of guessing
          # the exact subfolder makes this resilient to that kind of
          # packaging detail changing.
          $candidates = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse -Filter "mpv.exe" -ErrorAction SilentlyContinue
          if (-not $candidates) {
            Write-Error "choco installed mpv but no mpv.exe was found anywhere under C:\ProgramData\chocolatey\lib - the package layout may have changed."
            exit 1
          }
          # The chocolatey shim at ...\chocolatey\bin\mpv.exe (outside \lib,
          # so not in this search anyway) is a tiny redirect stub, not the
          # real binary — picking the largest match is an extra safeguard.
          $mpvExe = ($candidates | Sort-Object Length -Descending | Select-Object -First 1).FullName

          New-Item -ItemType Directory -Force -Path packaging/windows/vendor | Out-Null
          Copy-Item $mpvExe packaging/windows/vendor/mpv.exe

          $size = (Get-Item packaging/windows/vendor/mpv.exe).Length
          if ($size -lt 1MB) {
            Write-Error "Copied mpv.exe is only $size bytes from $mpvExe - this doesn't look like the real binary."
            exit 1
          }
          Write-Host "Bundled mpv.exe from $mpvExe ($size bytes)"

          # Ship mpv's own license alongside it — standard practice when
          # bundling a third-party GPL/LGPL binary (see backends/windows_mpv.py's
          # docstring for why this doesn't create a licensing conflict with
          # LiveWall's own AGPL-3.0-or-later: subprocess+IPC, not linking).
          # Best-effort: not every chocolatey package layout ships one
          # alongside the binary, and that's not worth failing the build over.
          $license = Get-ChildItem -Path (Split-Path $mpvExe -Parent) -Filter "*LICENSE*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($license) {
            Copy-Item $license.FullName packaging/windows/vendor/mpv-LICENSE.txt
          }

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/windows/livewall.spec --noconfirm

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/LiveWall/* -DestinationPath LiveWall-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall-windows
          path: LiveWall-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveWall-windows.zip
          generate_release_notes: true
