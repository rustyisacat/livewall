name: Windows build

# Must run on a real Windows runner — PyInstaller does not cross-compile,
# so this can't be produced from the Linux machine this project is
# developed on. Triggered manually or on a release tag; uploads the built
# LiveWall.exe (as a zipped onedir folder) as a workflow artifact, and
# attaches it to the release when triggered by one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # No python-version input here — that's a setup-python input, not
        # setup-uv's; uv already picks Python 3.12 from pyproject.toml's
        # requires-python on its own.
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # pyproject.toml's Windows-only deps (PySide6, pywin32, winshell)
        # are gated by sys_platform == 'win32' markers, not an extras group —
        # `uv sync` resolves them automatically since this runner IS win32.
        # --group windows-build additionally pulls in PyInstaller itself
        # (a build tool, not something LiveWall depends on at runtime).
        run: uv sync --group windows-build

      - name: Fetch mpv.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/vendor | Out-Null
          # NOTE: the project-root "files/latest/download" link is ambiguous —
          # this project publishes separate 64bit-v3/64bit/32bit/libmpv/release
          # folders, so SourceForge can't pick one and serves the HTML file
          # listing page instead of redirecting to an actual file (this broke
          # CI once already: a 133KB "archive" that 7z refused to open). Scope
          # "latest" to the plain 64bit folder (not 64bit-v3, which needs an
          # AVX2 CPU — the baseline build is the safer bet for an unknown
          # tester's machine) to get an unambiguous redirect to a real file.
          $url = "https://sourceforge.net/projects/mpv-player-windows/files/64bit/latest/download"
          $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
          Invoke-WebRequest -Uri $url -OutFile mpv-build.7z -Headers $headers -MaximumRedirection 10

          $size = (Get-Item mpv-build.7z).Length
          if ($size -lt 1MB) {
            Write-Error "Downloaded mpv-build.7z is only $size bytes - SourceForge likely served an HTML page instead of the real archive. Check https://sourceforge.net/projects/mpv-player-windows/files/64bit/ for the current file layout."
            exit 1
          }

          7z x mpv-build.7z -ompv-extracted
          Copy-Item mpv-extracted/mpv.exe packaging/windows/vendor/mpv.exe
          # Ship mpv's own license alongside it — standard practice when
          # bundling a third-party GPL/LGPL binary (see backends/windows_mpv.py's
          # docstring for why this doesn't create a licensing conflict with
          # LiveWall's own AGPL-3.0-or-later: subprocess+IPC, not linking).
          if (Test-Path mpv-extracted/README.txt) {
            Copy-Item mpv-extracted/README.txt packaging/windows/vendor/mpv-LICENSE.txt
          }

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/windows/livewall.spec --noconfirm

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/LiveWall/* -DestinationPath LiveWall-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall-windows
          path: LiveWall-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveWall-windows.zip
