[project]
name = "livewall"
version = "1.1.1"
description = "Live wallpaper manager for Hyprland + Caelestia (Linux) and Windows"
readme = "README.md"
authors = [
    { name = "HChaffin", email = "harrisonchaffin@gmail.com" }
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    # >=1.0, not the old >=0.60 floor: tui_theme.py uses App.register_theme /
    # App.theme, Textual's Theme API which didn't exist back at 0.60.
    "textual>=1.0; sys_platform != 'win32'",
    "textual-image>=0.13.2; sys_platform != 'win32'",
    "pyside6>=6.5; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "winshell>=0.6; sys_platform == 'win32'",
]

[project.scripts]
livewall = "livewall.cli:main"
livewall-gui = "livewall.gui:run"
livewall-picker = "livewall.picker:run"
livewall-windows-gui = "livewall.gui_qt.app:run"

[dependency-groups]
# Build-time only — not something an end user installing LiveWall needs.
windows-build = ["pyinstaller>=6.0; sys_platform == 'win32'"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
module-name = "livewall"
